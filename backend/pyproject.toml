[project]
name = "zhixu-knowledge-backend"
version = "0.8.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "python-multipart>=0.0.18",
  "cryptography>=44", "pydantic-settings>=2.6,<3", "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<2", "langchain-openai>=0.3,<2", "httpx>=0.27,<1",
  "jieba>=0.42.1", "python-docx>=1.1", "pymupdf>=1.25", "openpyxl>=3.1",
  "xlrd>=2", "Pillow>=11"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "xlwt>=1.3"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["tongyi_models.json", "chunking_methods.json"]
